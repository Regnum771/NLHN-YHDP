<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Luyện tập</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Literata:opsz,wght@7..72,400;7..72,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E7A4F;text-decoration:none}a:hover{color:#17603E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F3; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #15201C; display: flex; flex-direction: column; overflow: hidden">

<header style="flex-shrink: 0; padding: 28px 16px 10px 16px; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; padding: 0 4px; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Luyện tập</h1>
<div role="search" style="height: 48px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #C9D0CC; border-radius: 24px; padding: 0 16px; display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3B4541" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<label for="module-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tìm học phần, chủ đề</label>
<input id="module-search" type="search" placeholder="Tìm học phần, chủ đề…" style="flex-grow: 1; min-width: 0; border: 0; outline: none; font-family: inherit; font-size: 16px; color: #15201C; background: transparent">
</div>
<div aria-label="Lọc theo chủ đề" style="display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; padding-bottom: 2px">
<button type="button" style="min-height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9D0CC; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #15201C; cursor: pointer">Miền năng lực<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" style="min-height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9D0CC; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #15201C; cursor: pointer">Vấn đề cốt lõi<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" style="min-height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9D0CC; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #15201C; cursor: pointer">Mức nhận thức<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
<div aria-label="Trạng thái" style="display: flex; gap: 8px">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="3">
<button type="button" aria-pressed="{{ f.pressed }}" onClick="{{ f.pick }}" style="{{ f.style }}">{{ f.label }}</button>
</sc-for>
</div>
</header>

<main style="flex-grow: 1; overflow-y: auto; padding: 4px 16px 20px 16px; display: flex; flex-direction: column; gap: 10px">
<a href="Decks.dc.html" style="background: #15201C; color: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #24302B; color: #A6DDBF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="13" rx="2"></rect><path d="M7 4h12a2 2 0 0 1 2 2v11"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 600">Thẻ ôn</span>
<span style="font-size: 13px; color: #C9D3CF">12 thẻ đến hạn hôm nay · 104 thẻ trong 2 học phần</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A6DDBF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<h2 style="margin: 6px 4px 0 4px; font-size: 13px; font-weight: 600; color: #58635F; text-transform: uppercase; letter-spacing: 0.06em">Học phần</h2>
<sc-for list="{{ modules }}" as="m" hint-placeholder-count="6">
<a href="Unit.dc.html" style="background: #FFFFFF; border: 1px solid #DCE1DD; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; color: #15201C">
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<span style="font-size: 16px; font-weight: 600; line-height: 1.35">{{ m.name }}</span>
<span style="font-size: 12px; color: #58635F; white-space: nowrap">{{ m.topics }}</span>
</span>
<span style="display: flex; align-items: center; gap: 10px">
<span style="flex-grow: 1; height: 5px; border-radius: 3px; background: #E6EAE7; overflow: hidden"><span style="{{ m.bar }}"></span></span>
<span style="{{ m.tagStyle }}">{{ m.tag }}</span>
</span>
</a>
</sc-for>
</main>

<nav aria-label="Điều hướng chính" style="height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #DCE1DD; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 6px; box-sizing: border-box">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #58635F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Trang chủ</a>
<a href="Chat.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #58635F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Hỏi đáp</a>
<a href="Modules.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: #1E7A4F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Luyện tập</a>
<a href="Exams.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #58635F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2.5"></path><path d="M9 2h6"></path></svg>Thi thử</a>
<a href="ProgressSkills.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #58635F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></svg>Tiến độ</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { filter: 'all' };
}
renderVals() {
var self = this;
var all = [
{ name: 'Dịch tễ học cơ bản', done: 3, total: 8 },
{ name: 'Tiêm chủng mở rộng', done: 1, total: 6 },
{ name: 'Sức khỏe môi trường', done: 0, total: 7 },
{ name: 'Dinh dưỡng cộng đồng', done: 0, total: 6 },
{ name: 'Bệnh truyền nhiễm', done: 0, total: 9 },
{ name: 'Thống kê y sinh', done: 2, total: 5 }
];
var f = this.state.filter;
var shown = all.filter(function (m) { return f === 'all' || (f === 'doing' && m.done > 0) || (f === 'new' && m.done === 0); });
var modules = shown.map(function (m) {
var started = m.done > 0;
return {
name: m.name,
topics: m.total + ' chủ đề',
bar: 'display: block; height: 5px; background: #1E7A4F; width: ' + Math.round(m.done / m.total * 100) + '%',
tag: started ? 'Tiếp tục' : 'Bắt đầu',
tagStyle: 'font-size: 13px; font-weight: 600; white-space: nowrap; color: ' + (started ? '#17603E' : '#3B4541')
};
});
var defs = [{ id: 'all', label: 'Tất cả' }, { id: 'doing', label: 'Đang học' }, { id: 'new', label: 'Chưa học' }];
var filters = defs.map(function (d) {
var on = d.id === f;
return {
label: d.label,
pressed: on ? 'true' : 'false',
style: 'min-height: 44px; padding: 0 16px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; ' + (on ? 'background: #15201C; color: #FFFFFF; border: 1px solid #15201C;' : 'background: transparent; color: #15201C; border: 1px solid #C9D0CC;'),
pick: function () { self.setState({ filter: d.id }); }
};
});
return { modules: modules, filters: filters };
}
}
</script>
</body>
</html>
