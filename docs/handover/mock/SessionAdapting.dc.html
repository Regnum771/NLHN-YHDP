<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Phiên hôm nay — gia sư đang điều chỉnh</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Literata:opsz,wght@7..72,400;7..72,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A6DDBF;text-decoration:none}a:hover{color:#FFFFFF}
@keyframes fillA{from{width:0}to{width:100%}}
@keyframes fillB{from{width:0}to{width:100%}}
@keyframes inA{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.75}}
@media (prefers-reduced-motion: reduce){.anim{animation:none !important;opacity:1 !important;transform:none !important;width:100% !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #15201C; color: #FFFFFF; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 8px 12px 0 12px">
<button type="button" onClick="{{ replay }}" style="min-height: 44px; padding: 0 8px; border: 0; background: transparent; color: #8FA19A; font-family: inherit; font-size: 13px; cursor: pointer">Phát lại hiệu ứng</button>
<a href="Unit.dc.html" style="min-height: 44px; padding: 0 8px; display: flex; align-items: center; font-size: 14px; font-weight: 500">Bỏ qua</a>
</header>

<main style="flex-grow: 1; padding: 40px 28px 20px 28px; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 18px">
<span class="anim" style="width: 64px; height: 64px; border-radius: 20px; background: #24302B; display: flex; align-items: center; justify-content: center; animation: pulse 1.6s ease-in-out infinite">
<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2c.6 4.4 3.6 7.4 8 8-4.4.6-7.4 3.6-8 8-.6-4.4-3.6-7.4-8-8 4.4-.6 7.4-3.6 8-8z" fill="#E8B04F"></path><path d="M19 14c.3 2 1.3 3 3 3.3-1.7.3-2.7 1.3-3 3.3-.3-2-1.3-3-3-3.3 1.7-.3 2.7-1.3 3-3.3z" fill="#E8B04F"></path></svg>
</span>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em">Gia sư đang điều chỉnh lộ trình của bạn</h1>
<span style="font-size: 15px; color: #C9D3CF">Dựa trên 6 câu luyện điểm yếu bạn vừa làm</span>
</div>
</div>

<div role="progressbar" aria-label="Đang cập nhật" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" style="height: 6px; border-radius: 3px; background: #2E3A35; overflow: hidden">
<span class="anim" style="{{ barStyle }}"></span>
</div>

<ol aria-live="polite" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{ steps }}" as="st" hint-placeholder-count="4">
<li class="anim" style="{{ st.style }}">
<span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; background: #1E7A4F; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>
<span style="flex-grow: 1; font-size: 15px; line-height: 1.4">{{ st.label }}</span>
<span style="font-size: 13px; font-weight: 600; color: #A6DDBF; white-space: nowrap">{{ st.result }}</span>
</li>
</sc-for>
</ol>
</main>

<footer class="anim" style="{{ ctaStyle }}">
<a href="Unit.dc.html" style="height: 54px; border-radius: 14px; background: #FFFFFF; color: #15201C; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Bước 3: Học tiếp</a>
<a href="Main.dc.html" style="min-height: 44px; margin-top: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #C9D3CF">Dừng ở đây, về trang chủ</a>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { run: 0 };
}
renderVals() {
var self = this;
var k = this.state.run % 2 === 0 ? 'A' : 'B';
var data = [
{ label: 'Chấm bài', result: '4/6 câu đúng' },
{ label: 'Cập nhật mức thành thạo', result: '2 năng lực' },
{ label: 'Tạo thẻ ôn từ câu sai', result: '+2 thẻ' },
{ label: 'Sắp xếp lại phiên ngày mai', result: 'mẫu số lên đầu' }
];
var steps = data.map(function (d, i) {
return {
label: d.label, result: d.result,
style: 'display: flex; align-items: center; gap: 14px; min-height: 52px; border-bottom: 1px solid #24302B; opacity: 0; animation: in' + k + ' 0.4s ease-out ' + (0.5 + i * 0.6).toFixed(1) + 's forwards;'
};
});
return {
steps: steps,
barStyle: 'display: block; height: 6px; background: #A6DDBF; width: 0; animation: fill' + k + ' 2.8s cubic-bezier(0.4, 0, 0.2, 1) 0.2s forwards;',
ctaStyle: 'flex-shrink: 0; padding: 12px 20px 28px 20px; opacity: 0; animation: in' + k + ' 0.4s ease-out 3.1s forwards;',
replay: function () { self.setState({ run: self.state.run + 1 }); }
};
}
}
</script>
</body>
</html>
