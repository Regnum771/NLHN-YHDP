<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chọn học phần</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Literata:opsz,wght@7..72,400;7..72,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E7A4F;text-decoration:none}a:hover{color:#17603E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F3; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #15201C; display: flex; flex-direction: column; overflow: hidden">

<header style="flex-shrink: 0; padding: 32px 20px 12px 20px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: #58635F">Bước cuối</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em">Bạn muốn tập trung ôn chủ đề nào?</h1>
<span style="font-size: 14px; color: #58635F">Chủ đề có thể được cập nhập bất cứ lúc nào</span>
</header>

<main style="flex-grow: 1; overflow-y: auto; padding: 8px 16px 16px 16px">
<div role="group" aria-label="Học phần" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ modules }}" as="m" hint-placeholder-count="8">
<button type="button" aria-pressed="{{ m.pressed }}" onClick="{{ m.toggle }}" style="{{ m.style }}">
<span style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; width: 100%">
<span style="font-size: 15px; font-weight: 600; line-height: 1.35; text-align: left">{{ m.name }}</span>
<span style="{{ m.checkStyle }}"><sc-if value="{{ m.on }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></sc-if></span>
</span>
<span style="font-size: 12px; color: #58635F">{{ m.topics }}</span>
</button>
</sc-for>
</div>
</main>

<footer style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #DCE1DD; padding: 12px 16px 20px 16px; display: flex; flex-direction: column; gap: 8px">
<span aria-live="polite" style="font-size: 13px; color: #58635F; text-align: center">{{ countLabel }}</span>
<sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
<a href="ExamRules.dc.html" style="min-height: 52px; border-radius: 14px; background: #1E7A4F; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 16px; font-weight: 600">Làm bài đánh giá năng lực</span><span style="font-size: 12px; color: rgb(227, 242, 233)">bám sát nội dung ôn tập với nhu cầu&nbsp;</span></a>
<a href="Unit.dc.html" style="min-height: 48px; border-radius: 14px; border: 1px solid #C9D0CC; background: #FFFFFF; color: #15201C; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Bỏ qua, vào học ngay</a>
</sc-if>
<sc-if value="{{ notReady }}" hint-placeholder-val="{{ false }}">
<button type="button" disabled="" style="min-height: 52px; border: 0; border-radius: 14px; background: #DCE1DD; color: #6B7571; font-family: inherit; font-size: 16px; font-weight: 600">Làm bài đánh giá năng lực</button>
<button type="button" disabled="" style="min-height: 48px; border-radius: 14px; border: 1px solid #DCE1DD; background: #FFFFFF; color: #8A938F; font-family: inherit; font-size: 15px; font-weight: 600">Bỏ qua, vào học ngay</button>
</sc-if>
<span style="font-size: 12px; color: #58635F; text-align: center">Bài đánh giá luôn có ở tab Thi thử.</span>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: { 0: true, 1: true } };
}
renderVals() {
var self = this;
var all = [
{ name: 'Dịch tễ học cơ bản', total: 8 },
{ name: 'Tiêm chủng mở rộng', total: 6 },
{ name: 'Sức khỏe môi trường', total: 7 },
{ name: 'Dinh dưỡng cộng đồng', total: 6 },
{ name: 'Bệnh truyền nhiễm', total: 9 },
{ name: 'Thống kê y sinh', total: 5 },
{ name: 'Sức khỏe nghề nghiệp', total: 6 },
{ name: 'Quản lý y tế', total: 5 }
];
var picked = this.state.picked;
var count = 0;
var modules = all.map(function (m, i) {
var on = !!picked[i];
if (on) count++;
return {
name: m.name,
topics: m.total + ' chủ đề',
on: on,
pressed: on ? 'true' : 'false',
style: 'min-height: 96px; box-sizing: border-box; padding: 14px; border-radius: 16px; font-family: inherit; color: #15201C; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 10px; ' + (on ? 'background: #E3F2E9; border: 2px solid #1E7A4F;' : 'background: #FFFFFF; border: 1px solid #DCE1DD; margin: 1px;'),
checkStyle: 'width: 22px; height: 22px; flex-shrink: 0; border-radius: 11px; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #1E7A4F;' : 'border: 1.5px solid #C9D0CC; box-sizing: border-box;'),
toggle: function () { var next = Object.assign({}, self.state.picked); next[i] = !next[i]; self.setState({ picked: next }); }
};
});
return {
modules: modules,
ready: count > 0,
notReady: count === 0,
countLabel: count > 0 ? 'Đã chọn ' + count + ' học phần' : 'Chọn ít nhất 1 học phần'
};
}
}
</script>
</body>
</html>
