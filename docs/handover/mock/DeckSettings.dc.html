<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cài đặt ôn tập</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Literata:opsz,wght@7..72,400;7..72,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E7A4F;text-decoration:none}a:hover{color:#17603E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F3; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #15201C; display: flex; flex-direction: column; overflow: hidden">

<header style="flex-shrink: 0; padding: 8px 8px 4px 8px; display: flex; align-items: center; gap: 4px">
<a href="DeckDetail.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15201C"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 700">Cài đặt ôn tập</h1>
</header>

<main style="flex-grow: 1; overflow-y: auto; padding: 8px 16px 20px 16px; display: flex; flex-direction: column; gap: 18px">

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 0 0 4px; font-size: 13px; font-weight: 600; color: #58635F; text-transform: uppercase; letter-spacing: 0.06em">Mỗi ngày</h2>
<div style="background: #FFFFFF; border: 1px solid #DCE1DD; border-radius: 16px; padding: 4px 8px 4px 16px">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 60px; border-bottom: 1px solid #ECEFEC">
<span style="font-size: 15px">Thẻ mới tối đa</span>
<div style="display: flex; align-items: center; gap: 4px">
<button type="button" aria-label="Giảm thẻ mới" onClick="{{ decNew }}" style="width: 44px; height: 44px; border: 1px solid #C9D0CC; background: #FFFFFF; border-radius: 12px; font-family: inherit; font-size: 20px; color: #15201C; cursor: pointer">−</button>
<span aria-live="polite" style="width: 44px; text-align: center; font-size: 17px; font-weight: 700">{{ newPerDay }}</span>
<button type="button" aria-label="Tăng thẻ mới" onClick="{{ incNew }}" style="width: 44px; height: 44px; border: 1px solid #C9D0CC; background: #FFFFFF; border-radius: 12px; font-family: inherit; font-size: 20px; color: #15201C; cursor: pointer">+</button>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 60px">
<span style="font-size: 15px">Lượt ôn tối đa</span>
<span style="font-size: 17px; font-weight: 700; padding-right: 12px">200</span>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 0 0 4px; font-size: 13px; font-weight: 600; color: #58635F; text-transform: uppercase; letter-spacing: 0.06em">Mức nhớ mục tiêu</h2>
<div style="background: #FFFFFF; border: 1px solid #DCE1DD; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div role="radiogroup" aria-label="Mức nhớ mục tiêu" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ retention }}" as="r" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{ r.checked }}" onClick="{{ r.pick }}" style="{{ r.style }}">{{ r.label }}</button>
</sc-for>
</div>
<span style="font-size: 13px; line-height: 1.5; color: #3B4541">{{ retentionHint }}</span>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 0 0 4px; font-size: 13px; font-weight: 600; color: #58635F; text-transform: uppercase; letter-spacing: 0.06em">Kỳ thi</h2>
<div style="background: #FFFFFF; border: 1px solid #DCE1DD; border-radius: 16px; padding: 4px 16px">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 60px; border-bottom: 1px solid #ECEFEC"><span style="font-size: 15px">Ngày thi</span><span style="font-size: 15px; font-weight: 600">01 / 03 / 2027</span></div>
<label style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px; cursor: pointer"><span style="font-size: 15px; line-height: 1.4">Dồn lịch ôn trước ngày thi</span><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1E7A4F"></label>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 0 0 4px; font-size: 13px; font-weight: 600; color: #58635F; text-transform: uppercase; letter-spacing: 0.06em">Gia sư tạo thẻ từ kết quả</h2>
<div style="background: #FFFFFF; border: 1px solid #DCE1DD; border-radius: 16px; padding: 4px 16px">
<label style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px solid #ECEFEC; cursor: pointer"><span style="font-size: 15px">Quiz trong học phần</span><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1E7A4F"></label>
<label style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px solid #ECEFEC; cursor: pointer"><span style="font-size: 15px">Bài đánh giá năng lực</span><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1E7A4F"></label>
<label style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px; cursor: pointer"><span style="font-size: 15px">Đề thi thử</span><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1E7A4F"></label>
</div>
</section>

<button type="button" style="align-self: center; min-height: 44px; border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: #17603E; cursor: pointer">Khôi phục mặc định</button>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { newPerDay: 20, target: 90 };
}
renderVals() {
var self = this;
var t = this.state.target;
var retention = [85, 90, 95].map(function (v) {
var on = v === t;
return { label: v + '%', checked: on ? 'true' : 'false', style: 'min-height: 44px; border-radius: 12px; font-family: inherit; font-size: 15px; cursor: pointer; ' + (on ? 'background: #15201C; color: #FFFFFF; border: 1px solid #15201C; font-weight: 600;' : 'background: #FFFFFF; color: #15201C; border: 1px solid #C9D0CC;'), pick: function () { self.setState({ target: v }); } };
});
var hint = t === 95 ? 'Nhớ chắc hơn, nhưng mỗi ngày ôn nhiều thẻ hơn.' : (t === 85 ? 'Ít thẻ phải ôn hơn, chấp nhận quên nhiều hơn.' : 'Cân bằng giữa số thẻ phải ôn và mức nhớ.');
return {
newPerDay: this.state.newPerDay,
decNew: function () { self.setState({ newPerDay: Math.max(0, self.state.newPerDay - 5) }); },
incNew: function () { self.setState({ newPerDay: self.state.newPerDay + 5 }); },
retention: retention,
retentionHint: hint
};
}
}
</script>
</body>
</html>
