<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Câu luyện tập do AI hỗ trợ tạo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Literata:opsz,wght@7..72,400;7..72,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E7A4F;text-decoration:none}a:hover{color:#17603E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F3; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #15201C; display: flex; flex-direction: column; overflow: hidden">

<header style="flex-shrink: 0; padding: 8px 12px 14px 12px; background: #FFFFFF; border-bottom: 1px solid #DCE1DD; display: flex; align-items: center; gap: 8px">
<a href="Unit.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15201C">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
</a>
<div style="flex-grow: 1; display: flex; flex-direction: column">
<span style="font-size: 16px; font-weight: 600">Dịch tễ học cơ bản</span>
<span style="font-size: 12px; color: #58635F">Chủ đề 3 · Đo lường bệnh trạng</span>
</div>
</header>

<main style="flex-grow: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">

<div role="note" style="display: flex; gap: 12px; align-items: flex-start; background: #FBEFD9; border: 1px solid #E8C48F; border-radius: 14px; padding: 12px 14px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8F4207" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 3l9 16H3z"></path><path d="M12 10v4"></path><path d="M12 17h.01"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px">
<strong style="font-size: 14px; font-weight: 600; color: #6B3A08">Câu do AI hỗ trợ tạo</strong>
<span style="font-size: 13px; line-height: 1.45; color: #6B3A08">Chưa qua thẩm định chuyên gia · không tính vào đánh giá</span>
</span>
</div>

<h1 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 1.5">Chỉ số nào có tử số là số ca mới xuất hiện trong một khoảng thời gian?</h1>

<figure style="margin: 0; background: #FFFFFF; border: 1px solid #DCE1DD; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<figcaption style="font-size: 12px; font-weight: 600; color: #17603E">Nguồn · Giáo trình Dịch tễ học, tr. 58</figcaption>
<blockquote style="margin: 0; font-family: 'Literata', Georgia, serif; font-size: 14px; line-height: 1.65; color: #2A2F2C">[…] <mark style="background: #E3F2E9; color: #15201C">Tỷ lệ mới mắc chỉ tính các ca mới xuất hiện trong một khoảng thời gian</mark> […]</blockquote>
</figure>

<div role="radiogroup" aria-label="Phương án" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ options }}" as="o" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{ o.checked }}" onClick="{{ o.pick }}" style="{{ o.style }}">
<span style="{{ o.badge }}">{{ o.letter }}</span>
<span style="flex-grow: 1; text-align: left">{{ o.text }}</span>
</button>
</sc-for>
</div>

<button type="button" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 8px; border: 1px solid #C9D0CC; background: #FFFFFF; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 14px; color: #15201C; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg>Báo lỗi câu này</button>
</main>

<footer style="flex-shrink: 0; padding: 12px 16px 20px 16px; background: #FFFFFF; border-top: 1px solid #DCE1DD; display: flex; gap: 10px">
<button type="button" aria-label="Hỏi gia sư" style="width: 50px; height: 50px; flex-shrink: 0; border: 1px solid #C9D0CC; background: #FFFFFF; border-radius: 14px; color: #15201C; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
</button>
<button type="button" style="height: 50px; padding: 0 16px; border: 1px solid #C9D0CC; background: #FFFFFF; border-radius: 14px; font-family: inherit; font-size: 15px; color: #15201C; cursor: pointer">Bỏ qua</button>
<button type="button" style="{{ checkStyle }}">Kiểm tra</button>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: null };
}
renderVals() {
var self = this;
var base = 'display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; box-sizing: border-box; padding: 10px 14px; border-radius: 14px; font-family: inherit; font-size: 15px; line-height: 1.4; color: #15201C; cursor: pointer; background: #FFFFFF; ';
var opts = [{ id: 'a', letter: 'A', text: 'Tỷ lệ hiện mắc' }, { id: 'b', letter: 'B', text: 'Tỷ lệ mới mắc' }, { id: 'c', letter: 'C', text: 'Tỷ suất tử vong' }, { id: 'd', letter: 'D', text: 'Tỷ số chênh' }];
var options = opts.map(function (o) {
var on = o.id === self.state.picked;
return {
letter: o.letter, text: o.text, checked: on ? 'true' : 'false',
style: base + (on ? 'border: 2px solid #15201C;' : 'border: 1px solid #C9D0CC;'),
badge: 'width: 30px; height: 30px; flex-shrink: 0; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; ' + (on ? 'background: #15201C; color: #FFFFFF;' : 'background: #ECEFEC; color: #15201C;'),
pick: function () { self.setState({ picked: o.id }); }
};
});
var ready = this.state.picked !== null;
return {
options: options,
checkStyle: 'flex-grow: 1; height: 50px; border: 0; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; ' + (ready ? 'background: #1E7A4F; color: #FFFFFF;' : 'background: #DCE1DD; color: #58635F;')
};
}
}
</script>
</body>
</html>
