<span style="font-size: 16px; font-weight: 600">Kết quả · Đề thi thử số 4</span>
</header>

<main style="flex-grow: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<section style="background: #FFFFFF; border: 1px solid #DCE1DD; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1">33</span><span style="font-size: 18px; color: #3B4541">/ 40 câu đúng</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px; background: #F5F6F3; border-radius: 12px; padding: 10px 12px"><span style="font-size: 12px; color: #3B4541">Sai</span><span style="font-size: 16px; font-weight: 600">6</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; background: #F5F6F3; border-radius: 12px; padding: 10px 12px"><span style="font-size: 12px; color: #3B4541">Bỏ trống</span><span style="font-size: 16px; font-weight: 600">1</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; background: #F5F6F3; border-radius: 12px; padding: 10px 12px"><span style="font-size: 12px; color: #3B4541">Thời gian</span><span style="font-size: 16px; font-weight: 600">48 phút</span></div>
</div>
</section>

<section aria-label="Ôn tập đã được cập nhật" style="background: #E3F2E9; border-radius: 18px; padding: 6px 16px; display: flex; flex-direction: column">
<span style="font-size: 12px; font-weight: 600; color: #17603E; text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 0 4px 0">Đã cập nhật ôn tập</span>
<a href="Decks.dc.html" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #C7E5D3; color: #15201C"><span style="font-size: 15px"><strong style="font-weight: 600">+6 thẻ</strong> gia sư tạo từ câu sai</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17603E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
<a href="Modules.dc.html" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; color: #15201C"><span style="font-size: 15px; line-height: 1.4">Ưu tiên ôn: <strong style="font-weight: 600">Dịch tễ học, Tiêm chủng</strong></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17603E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
</section>

<div aria-label="Lọc câu hỏi" style="display: flex; gap: 8px; overflow-x: auto">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
<button type="button" aria-pressed="{{ f.pressed }}" onClick="{{ f.pick }}" style="{{ f.style }}">{{ f.label }}</button>
</sc-for>
</div>

<section style="background: #FFFFFF; border: 1px solid #DCE1DD; border-radius: 16px; overflow: hidden">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
<a href="AnswerReview.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-bottom: 1px solid #ECEFEC; color: #15201C">
<span style="{{ r.dot }}">{{ r.mark }}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 500">Câu {{ r.n }}</span><span style="font-size: 12px; color: #58635F">{{ r.topic }}</span></span>
<span style="font-size: 13px; color: #17603E; font-weight: 500">Xem lại</span>
</a>
</sc-for>
</section>
</main>

<nav aria-label="Điều hướng chính" style="height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #DCE1DD; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 6px; box-sizing: border-box">

<a href="Chat.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #58635F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Hỏi đáp</a>
<a href="Modules.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #58635F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Luyện tập</a>
<a href="Exams.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: #1E7A4F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2.5"></path><path d="M9 2h6"></path></svg>Thi thử</a>
<a href="ProgressSkills.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #58635F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></svg>Tiến độ</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { filter: 'all' };
}
renderVals() {
var self = this;
var all = [
{ n: 1, topic: 'Dịch tễ học', r: 'ok' },
{ n: 2, topic: 'Sức khỏe môi trường', r: 'ok' },
{ n: 3, topic: 'Dịch tễ học', r: 'wrong' },
{ n: 4, topic: 'Bệnh truyền nhiễm', r: 'ok' },
{ n: 5, topic: 'Tiêm chủng', r: 'wrong' },
{ n: 6, topic: 'Thống kê y sinh', r: 'blank' },
{ n: 7, topic: 'Sức khỏe nghề nghiệp', r: 'ok' },
{ n: 8, topic: 'Dinh dưỡng', r: 'blank' }
];
var f = this.state.filter;
var rows = all.filter(function (x) { return f === 'all' || x.r === f; }).map(function (x) {
var look = x.r === 'ok' ? ['✓', 'background: #E3F2E9; color: #17603E;'] : (x.r === 'wrong' ? ['✕', 'background: #FDF3E4; color: #8F4207;'] : ['–', 'background: #ECEFEC; color: #3B4541;']);
return { n: x.n, topic: x.topic, mark: look[0], dot: 'width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; ' + look[1] };
});
var defs = [{ id: 'all', label: 'Tất cả' }, { id: 'wrong', label: 'Sai' }, { id: 'blank', label: 'Bỏ trống' }, { id: 'ok', label: 'Đúng' }];
var filters = defs.map(function (d) {
var on = d.id === f;
return { label: d.label, pressed: on ? 'true' : 'false', style: 'min-height: 44px; flex-shrink: 0; padding: 0 16px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; ' + (on ? 'background: #15201C; color: #FFFFFF; border: 1px solid #15201C;' : 'background: #FFFFFF; color: #15201C; border: 1px solid #C9D0CC;'), pick: function () { self.setState({ filter: d.id }); } };
});
return { rows: rows, filters: filters };
}
}
</script>
</body>
